# SonarCloud Configuration
sonar.projectKey=ultimate-trivia-championship
sonar.organization=alvesgf16

# Project Information
sonar.projectName=Ultimate Trivia Championship
sonar.projectVersion=1.0.0

# Source Code Configuration
sonar.sources=apps,packages
sonar.tests=apps/api/test,apps/api/src

# Test Files Pattern
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/test/**/*

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/*.config.js,**/*.config.mjs,**/*.config.ts

# Exclude test files from duplication checks
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/test/**/*

# Coverage Configuration
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/test/**/*,**/*.config.js,**/*.config.mjs,**/*.config.ts

# Source File Encoding
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.javascript.node.maxspace=4096

# Quality Gate Settings
sonar.qualitygate.wait=true

# Code Complexity Threshold
sonar.javascript.complexity.threshold=10
sonar.typescript.complexity.threshold=10
